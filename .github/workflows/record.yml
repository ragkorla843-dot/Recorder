on:
  workflow_dispatch:
    inputs:
      url:
        description: "m3u8 link"
        required: true
      name:
        description: "File name"
        default: "recording"
      hours:
        description: "Max hours (1 to 5)"
        default: "5"

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      URL: ${{ inputs.url }}
      NAME: ${{ inputs.name }}
      HOURS: ${{ inputs.hours }}
      MEGA_USER: ${{ secrets.MEGA_USER }}
      MEGA_PASS: ${{ secrets.MEGA_PASS }}
    steps:
      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg rclone

      - name: Record (no re-encoding, low CPU)
        continue-on-error: false
        run: |
          ffmpeg -y -loglevel error -reconnect 1 -reconnect_streamed 1 \
            -reconnect_delay_max 5 -i "$URL" -c copy \
            -t $((HOURS*3600)) "$NAME.mkv"

      - name: Upload to cloud and delete local file
        if: always()
        run: |
          rclone config create cloud mega user "$MEGA_USER" pass "$MEGA_PASS" >/dev/null
          rclone move "$NAME.mkv" cloud:Recordings
